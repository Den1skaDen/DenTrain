name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json
      - run: npm ci --prefix firebase-tests
      - run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Check committed Room schemas
        run: test -z "$(git status --porcelain -- app/schemas)"
      - name: Check Firestore access rules
        run: npx --yes firebase-tools@15.37.0 emulators:exec --project demo-dentrain-rules-test --only firestore 'npm test --prefix firebase-tests'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: npx --yes firebase-tools@15.37.0 emulators:exec --project demo-dentrain-rules-test --only auth,firestore 'bash .github/scripts/test-diary.sh'
